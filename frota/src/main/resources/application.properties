spring.application.name=frota

# Banco (pode sobrescrever com variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/frota?createDatabaseIfNotExist=true&serverTimezone=America/Recife}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Quem manda no schema é o Flyway; o Hibernate só confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Recife

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# JWT (em produção, defina JWT_SECRET com pelo menos 32 caracteres)
app.jwt.secret=${JWT_SECRET:dev-only-chave-secreta-troque-em-producao-0123456789}
app.jwt.expiracao-minutos=480

# Primeiro ADMIN (criado só se a tabela de usuários estiver vazia)
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@frota.local}
app.admin.senha=${ADMIN_SENHA:Admin@123}
